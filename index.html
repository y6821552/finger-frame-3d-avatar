<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171521" />
    <title>Finger Frame 3D</title>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <section id="stage" aria-label="Camera and 3D avatar stage">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="output" width="1280" height="720"></canvas>
      </section>
      <div id="loading" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span id="loading-message">Preparing local 3D experience…</span>
      </div>
      <div id="controls"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
