name: Bug report
description: 报告可复现的运行或兼容性问题
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: 请勿在公开 issue 中上传包含个人信息的人脸录像。安全问题请遵循 SECURITY.md。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 选择…\n3. 观察…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、设备型号、浏览器及版本
    validations:
      required: true
  - type: dropdown
    id: camera
    attributes:
      label: 摄像头
      options: [前置, 后置, 演示模式, 不适用]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 控制台错误
      render: shell
